<!-- Expense Modal -->
<div id="expenseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Add Expense</h2>
            <button class="modal-close">&times;</button>
        </div>

        <!-- Tabs for Expense Types -->
        <div class="modal-tabs">
            <button class="tab-btn active" data-tab="monthly-budget">Update Budget</button>
            <button class="tab-btn" data-tab="fixed-expense">Add Fixed Expense</button>
        </div>

        <!-- Monthly Budget Tab -->
        <div id="monthly-budget-tab" class="tab-content active">
            <form id="budgetForm" onsubmit="handleBudgetSubmit(event)">
                <div class="form-group">
                    <label for="budgetAmount">Monthly Budget (₹)</label>
                    <input 
                        type="number" 
                        id="budgetAmount" 
                        placeholder="Enter your monthly budget" 
                        min="0" 
                        step="0.01"
                        required
                    >
                    <small id="budgetNote" class="info-text"></small>
                </div>
                <button type="submit" class="modal-btn primary-btn">Update Budget</button>
            </form>
            <div id="budgetStatus" style="margin-top: 16px; padding: 12px; border-radius: 8px; display: none;"></div>
        </div>

        <!-- Fixed Expense Tab -->
        <div id="fixed-expense-tab" class="tab-content">
            <form id="expenseForm" onsubmit="handleExpenseSubmit(event)">
                <div class="form-group">
                    <label for="expenseType">Expense Type</label>
                    <select id="expenseType" required>
                        <option value="">Select expense type</option>
                        <option value="Rent">Rent</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Transportation">Transportation</option>
                        <option value="Insurance">Insurance</option>
                        <option value="Subscription">Subscription</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="expenseAmount">Amount (₹)</label>
                    <input 
                        type="number" 
                        id="expenseAmount" 
                        placeholder="Enter expense amount" 
                        min="0" 
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" class="modal-btn primary-btn">Add Expense</button>
            </form>

            <div id="expensesList" style="margin-top: 24px;"></div>
        </div>

        <div id="modalError" class="error-message" style="display: none;"></div>
        <div id="modalSuccess" class="success-message" style="display: none;"></div>
    </div>
</div>

<style>
