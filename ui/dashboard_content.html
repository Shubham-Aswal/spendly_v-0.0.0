<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Content</title>
  
  <!-- Google Fonts - Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./dashboard_content.css">
  
  <!-- Boxicons -->
  <link
    href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
    rel="stylesheet"
  />
</head>

<body>
  <div class="main">
    <!-- Balance Card -->
    <div id="balance_d">
      <i class="bx bx-wallet icon"></i>
      <h2>Current Balance</h2>
      <p id="balance-amount">₹0.00</p>
    </div>

    <!-- Daily Safe Spend Card -->
    <div id="dailySafespend_d">
      <i class="bx bx-money icon"></i>
      <h2>Daily Safe Spend</h2>
      <p id="safe-spend-amount">₹0.00</p>
    </div>

    <!-- Goals Card -->
    <div class="goals_d">
      <h2>💎 Goals</h2>
      <p>Track your savings goals and financial targets here. <span style="color: #94a3b8;">(Coming Soon)</span></p>
    </div>

    <!-- Daily Activity Card -->
    <div class="daily-activity_d">
      <h2>📊 Daily Activity</h2>
      <p>View your daily spending activity and transactions. <span style="color: #94a3b8;">(Coming Soon)</span></p>
    </div>
  </div>

  <script src="./ui-js/dashboard_contents.js"></script>
</body>

</html>
