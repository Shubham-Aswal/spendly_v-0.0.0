<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Container">
        <!-- CONTAINER LEFT -->
        <div class="Container-left">
            <!-- TOP NAME -->
            <div class="logo-container">
                <div class="logo-box">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <span class="logo-text">SPENDLY</span>
            </div>

            <div class="header">
                <h1 id="headerTitle">Welcome</h1>
                <p id="headerSub">Please enter your details</p>
            </div>

            <!-- SIGN IN AND SIGN UP   TABS -->
            <div class="input-tabs">
                <button class="sign-in active-tab" id="signInTab">Sign In</button>
                <button class="sign-up" id="signUpTab">Sign Up</button>
            </div>

            <form action="" id="authform" onsubmit="event.preventDefault();">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="email-input">
                        <i class="far fa-envelope"></i>
                        <input type="email" name="email" id="email" placeholder="xyz123@gmail.com">
                        <i class="fas fa-check-circle check-icon" id="emailCheck"></i>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
            </form>

            <div class="alternative-logins">
                <span>Or Continue With</span> 
            </div>

            <!-- SOCIAL LINKS -->
            <div class="social-logins">
                <div class="social-btn google">
                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" height="24px" width="24px" alt="Google">
                </div>
                <div class="social-btn apple">
                    <i class="fab fa-apple" style="font-size: 24px; color: #000;"></i>
                </div>
                <div class="social-btn facebook">
                    <i class="fab fa-facebook-f" id="emailfb" style="font-size: 20px; color: #1877F2;"></i>
                </div>
            </div>
            
            <p class="footer">
                Join the millions of smart investors who trust us to manage their finances. Log in to access your personalized dashboard, track your portfolio performance, and make informed investment decisions.
            </p>
        </div>

        <!-- CONTAINER RIGHT  -->
        <div class="Container-right">
            <img src="./media/login-pageP.png" alt="Finance Dashboard Preview">
        </div>
    </div>

    <script>
        const signInTab = document.getElementById('signInTab');
        const signUpTab = document.getElementById('signUpTab');
        const headerTitle = document.getElementById('headerTitle');
        const headerSub = document.getElementById('headerSub');
        const submitBtn = document.getElementById('submitBtn');


        //FUNCTION TO SWITCH TO SIGN IN
        signInTab.addEventListener('click', () => {
            signInTab.classList.add('active-tab');
            signUpTab.classList.remove('active-tab');
            headerTitle.innerText = 'Welcome';
            headerSub.innerText = 'Please enter your details';
            submitBtn.innerText = 'Submit';
        })

        //FUNCTION TO SWITCH TO SIGN UP
        signUpTab.addEventListener('click', () => {
            signUpTab.classList.add('active-tab');
            signInTab.classList.remove('active-tab');
            headerTitle.innerText = 'Create Account';
            headerSub.innerText = 'Join us and start managing your finances'
            submitBtn.innerText = 'Register'
        })

        //EMAIL CHECK ICON LOGIC
        const emailInput = document.getElementById('email');
        const checkIcon = document.getElementById('emailCheck');
        emailInput.addEventListener('input', () => {
            const emailValue = emailInput.value;
            if (emailValue.includes('@') && emailValue.includes('.com') && emailValue.length > 5){
                checkIcon.classList.add('visible');
            } else {
                checkIcon.classList.remove('visible');
            }
        })


    </script>
</body>
</html>
