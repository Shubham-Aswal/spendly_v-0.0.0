<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spendly - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="Container">
        <!-- CONTAINER LEFT -->
        <div class="Container-left">
            <!-- TOP NAME -->
            <div class="logo-container">
                <div class="logo-box">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <span class="logo-text">SPENDLY</span>
            </div>

            <div class="header">
                <h1 id="headerTitle">Welcome</h1>
                <p id="headerSub">Please enter your details</p>
            </div>

            <!-- SIGN IN AND SIGN UP   TABS -->
            <div class="input-tabs">
                <button class="sign-in active-tab" id="signInTab">Sign In</button>
                <button class="sign-up" id="signUpTab">Sign Up</button>
            </div>

            <form action="" id="authform" onsubmit="handleFormSubmit(event);">
                <!-- NAME FIELD - SIGNUP ONLY -->
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label for="name" class="form-label">Full Name</label>
                    <div class="input-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" name="name" id="name" placeholder="John Doe">
                    </div>
                </div>

                <!-- PHONE FIELD - SIGNUP ONLY -->
                <div class="form-group" id="phoneGroup" style="display: none;">
                    <label for="phone" class="form-label">Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone"></i>
                        <input type="tel" name="phone" id="phone" placeholder="+1 234 567 8900">
                    </div>
                </div>

                <!-- EMAIL FIELD -->
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div class="email-input">
                        <i class="far fa-envelope"></i>
                        <input type="email" name="email" id="email" placeholder="xyz123@gmail.com">
                        <i class="fas fa-check-circle check-icon" id="emailCheck"></i>
                    </div>
                </div>

                <!-- PASSWORD FIELD -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password">
                        <i class="fas fa-eye toggle-password" id="togglePassword" style="cursor: pointer;"></i>
                    </div>
                </div>

                <!-- CONFIRM PASSWORD - SIGNUP ONLY -->
                <div class="form-group" id="confirmPasswordGroup" style="display: none;">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm your password">
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
                <div id="errorMessage" style="color: red; margin-top: 10px; display: none;"></div>
                <div id="successMessage" style="color: green; margin-top: 10px; display: none;"></div>
            </form>

            <div class="alternative-logins">
                <span>Or Continue With</span> 
            </div>

            <!-- SOCIAL LINKS -->
            <div class="social-logins">
                <div class="social-btn google">
                    <img src="https://www.gstatic.com/images/branding/product/1x/googleg_48dp.png" height="24px" width="24px" alt="Google">
                </div>
                <div class="social-btn apple">
                    <i class="fab fa-apple" style="font-size: 24px; color: #000;"></i>
                </div>
                <div class="social-btn facebook">
                    <i class="fab fa-facebook-f" id="emailfb" style="font-size: 20px; color: #1877F2;"></i>
                </div>
            </div>
            
            <p class="footer">
                Join the millions of smart investors who trust us to manage their finances. Log in to access your personalized dashboard, track your portfolio performance, and make informed investment decisions.
            </p>
        </div>

        <!-- CONTAINER RIGHT  -->
        <div class="Container-right">
            <img src="./media/login-pageP.png" alt="Finance Dashboard Preview">
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api'; // Change this to your backend URL
        let isSignUp = false;

        const signInTab = document.getElementById('signInTab');
        const signUpTab = document.getElementById('signUpTab');
        const headerTitle = document.getElementById('headerTitle');
        const headerSub = document.getElementById('headerSub');
        const submitBtn = document.getElementById('submitBtn');
        const nameGroup = document.getElementById('nameGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const emailInput = document.getElementById('email');
        const checkIcon = document.getElementById('emailCheck');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        // FUNCTION TO SWITCH TO SIGN IN
        signInTab.addEventListener('click', () => {
            isSignUp = false;
            signInTab.classList.add('active-tab');
            signUpTab.classList.remove('active-tab');
            headerTitle.innerText = 'Welcome';
            headerSub.innerText = 'Please enter your details';
            submitBtn.innerText = 'Sign In';
            
            nameGroup.style.display = 'none';
            phoneGroup.style.display = 'none';
            confirmPasswordGroup.style.display = 'none';
            
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('confirmPassword').value = '';
        });

        // FUNCTION TO SWITCH TO SIGN UP
        signUpTab.addEventListener('click', () => {
            isSignUp = true;
            signUpTab.classList.add('active-tab');
            signInTab.classList.remove('active-tab');
            headerTitle.innerText = 'Create Account';
            headerSub.innerText = 'Join us and start managing your finances';
            submitBtn.innerText = 'Register';
            
            nameGroup.style.display = 'block';
            phoneGroup.style.display = 'block';
            confirmPasswordGroup.style.display = 'block';
        });

        // EMAIL CHECK ICON LOGIC
        emailInput.addEventListener('input', () => {
            const emailValue = emailInput.value;
            if (emailValue.includes('@') && emailValue.includes('.') && emailValue.length > 5) {
                checkIcon.classList.add('visible');
            } else {
                checkIcon.classList.remove('visible');
            }
        });

        // PASSWORD TOGGLE VISIBILITY
        togglePassword.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.classList.remove('fa-eye');
                togglePassword.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                togglePassword.classList.add('fa-eye');
                togglePassword.classList.remove('fa-eye-slash');
            }
        });

        // VALIDATION FUNCTION
        function validateForm() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            errorMessage.innerText = '';
            successMessage.innerText = '';

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email) {
                showError('Email is required');
                return false;
            }

            if (!password || password.length < 6) {
                showError('Password must be at least 6 characters long');
                return false;
            }

            if (isSignUp) {
                const name = document.getElementById('name').value.trim();
                const phone = document.getElementById('phone').value.trim();
                const confirmPassword = document.getElementById('confirmPassword').value.trim();

                if (!name) {
                    showError('Name is required');
                    return false;
                }

                if (!phone) {
                    showError('Phone number is required');
                    return false;
                }

                if (password !== confirmPassword) {
                    showError('Passwords do not match');
                    return false;
                }
            }

            return true;
        }

        // ERROR AND SUCCESS HANDLERS
        function showError(message) {
            errorMessage.innerText = message;
            errorMessage.style.display = 'block';
        }

        function showSuccess(message) {
            successMessage.innerText = message;
            successMessage.style.display = 'block';
        }

        // FORM SUBMISSION HANDLER
        async function handleFormSubmit(event) {
            event.preventDefault();

            if (!validateForm()) {
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = isSignUp ? 'Registering...' : 'Signing In...';

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            try {
                let response;

                if (isSignUp) {
                    const name = document.getElementById('name').value.trim();
                    const phone = document.getElementById('phone').value.trim();

                    response = await axios.post(`${API_BASE_URL}/auth/signup`, {
                        name,
                        email,
                        phone,
                        password
                    });
                } else {
                    response = await axios.post(`${API_BASE_URL}/auth/signin`, {
                        email,
                        password
                    });
                }

                // Handle successful response
                if (response.data && response.data.token) {
                    showSuccess(isSignUp ? 'Account created successfully! Redirecting...' : 'Login successful! Redirecting...');
                    
                    // Store JWT token in localStorage
                    localStorage.setItem('jwtToken', response.data.token);
                    localStorage.setItem('user', JSON.stringify(response.data.user));

                    // Redirect to dashboard after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = './ui/dashboard.html';
                    }, 1500);
                } else {
                    showError('Authentication failed. Please try again.');
                }
            } catch (error) {
                // Handle error response
                const errorMsg = error.response?.data?.message || 'An error occurred. Please try again.';
                showError(errorMsg);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = isSignUp ? 'Register' : 'Sign In';
            }
        }
    </script>
</body>
</html>
